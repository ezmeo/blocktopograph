apply plugin: 'com.android.application'

android {
    namespace = 'com.mithrilmania.blocktopograph'
    compileSdkVersion rootProject.compileSdkVersion
    defaultConfig {
        applicationId 'io.github.ezmeo.blocktopograph'
        minSdkVersion rootProject.minSdkVersion
        targetSdkVersion rootProject.targetSdkVersion
        versionCode 2000003
        versionName "2.0.3"
        vectorDrawables.useSupportLibrary = true
    }
    dataBinding {
        enabled = true
    }
    configurations {
        implementation.exclude group: 'org.jetbrains', module: 'annotations'
    }
    //buildFeatures {
    //    buildConfig = true
    //}
    buildTypes {

        debug {
            //buildConfigField ("boolean","DEBUG_MODE","true")
            //applicationIdSuffix ".debug"
            minifyEnabled false
            //multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ext.alwaysUpdateBuildId = false
        }

        release {
            //buildConfigField ("boolean","DEBUG_MODE","false")
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    lint {
        disable 'ExpiredTargetSdkVersion'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar', '*.so', '*.aar'], dir: 'libs')
    //testImplementation 'junit:junit:4.13.2'
    implementation project(':leveldb')
    implementation project(':nestedradiobutton')
    implementation project(':tileview')
    implementation 'com.github.clans:fab:1.6.4'
    implementation ('com.github.bmelnychuk:atv:1.2.9') {exclude group: 'com.android.support'}
    implementation 'com.github.woxthebox:draglistview:1.7.3'
    implementation 'com.andreabaccega:android-edittext-validator:1.3.5'
    //core is the new recommended alias for analytics
    //implementation 'com.google.firebase:firebase-core:17.2.2'
    //implementation 'com.crashlytics.sdk.android:crashlytics:2.10.1'
    //implementation platform('com.google.firebase:firebase-bom:31.5.0')
    //implementation 'com.google.firebase:firebase-analytics'
    //implementation 'com.google.firebase:firebase-crashlytics'
    //implementation 'org.jetbrains:annotations-java5:15.0'
    implementation 'com.tomergoldst.android:tooltips:1.1.1'
    implementation 'androidx.annotation:annotation:1.11.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'com.github.bumptech.glide:glide:5.0.9'
    annotationProcessor 'com.github.bumptech.glide:compiler:5.0.9'
    //implementation 'com.github.MikeOrtiz:TouchImageView:2.1.1'
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'
    implementation 'com.github.florent37:expansionpanel:1.2.4'
    //implementation 'com.github.jbvincey:nestedradiobutton:1.1'
    implementation 'net.lingala.zip4j:zip4j:2.11.6'
    implementation 'commons-io:commons-io:2.22.0'
    implementation 'org.apache.commons:commons-lang3:3.21.0'
    //debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.1'
}

// apply plugin: 'com.google.gms.google-services'
// apply plugin: 'com.google.firebase.crashlytics'

tasks.configureEach { task ->
    if (task.name.contains("AndroidTest") || task.name.contains("connectedAndroidTest")) {
        task.enabled = false
    }
}